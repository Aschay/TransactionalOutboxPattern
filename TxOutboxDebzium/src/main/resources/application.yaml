server:
  port: 7000
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customerdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa.hibernate.ddl-auto: create-drop
  jpa.show-sql: true
  
logging:
  level:
    root: DEBUG
spring.output.ansi.enabled: ALWAYS
app:
  outbox:
    agregatetype: "customer"
      
